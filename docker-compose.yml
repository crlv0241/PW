services:
  mysql:
    container_name: pos_wms_mysql
    build:
      context: ./docker/mysql
      dockerfile: Dockerfile
    image: pos_wms_mysql:8.0
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-pos_wms}"
      MYSQL_USER: "${DB_USERNAME:-pos_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      TZ: "${APP_TIMEZONE:-UTC}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - pos_wms_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    container_name: pos_wms_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ] && [ "$$REDIS_PASSWORD" != "null" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      TZ: "${APP_TIMEZONE:-UTC}"
    volumes:
      - redis_data:/data
    networks:
      - pos_wms_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  pos_wms_network:
    driver: bridge
